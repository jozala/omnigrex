services:
  web:
    image: docker.io/library/busybox@sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
    command: ["sh", "-ec", "printf 'development-compose-ok' > /www/index.html; exec httpd -f -p 8080 -h /www"]
    volumes:
      - web-data:/www
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 1s
      timeout: 2s
      retries: 30
  client:
    image: docker.io/library/busybox@sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
    command: ["sh", "-ec", "test \"$$(wget -q -O - http://web:8080/)\" = development-compose-ok"]
volumes:
  web-data:
