name: omnigrex

services:
  orchestrator:
    build:
      context: .
    image: omnigrex/orchestrator:dev
    user: "10001:10001"
    environment:
      OMNIGREX_HTTP_ADDR: "${OMNIGREX_HTTP_ADDR:-:8080}"
      OMNIGREX_HEALTHCHECK_URL: "${OMNIGREX_HEALTHCHECK_URL:-http://127.0.0.1:8080/healthz}"
      OMNIGREX_SHUTDOWN_TIMEOUT: "${OMNIGREX_SHUTDOWN_TIMEOUT:-10s}"
    ports:
      - "${OMNIGREX_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/omnigrex", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    read_only: true
    tmpfs:
      - /tmp:mode=1777,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    init: true
    restart: unless-stopped
